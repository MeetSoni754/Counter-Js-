<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> Timer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .timer-app {
            background: #fff;
            width: 350px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .display-box {
            background: #f4f4f4;
            border-radius: 12px;
            padding: 30px;
            font-size: 70px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            text-align: center;
        }

        .btn-group {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        button {
            flex: 1;
            margin: 0 5px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .start {
            background: #4caf50;
        }

        .pause {
            background: #ff5252;
        }

        .reset {
            background: #ff9800;
        }

        #history {
            margin-top: 20px;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
            color: #444;
            font-size: 14px;
        }

        #history p {
            margin-bottom: 6px;
        }
    </style>
</head>

<body>

    <div class="timer-app">

        <div class="display-box" id="timerDisplay">00</div>

        <input type="number" id="timeInput" placeholder="Set target seconds">

        <div class="btn-group">
            <button class="start" onclick="startTimer()">Start</button>
            <button class="pause" onclick="pauseTimer()">Pause</button>
            <button class="reset" onclick="resetTimer()">Reset</button>
        </div>

        <div id="history"></div>

    </div>


    <script>
        let targetSeconds = 0;
        let runningSeconds = 0;
        let timerInterval = null;

        const timerDisplay = document.getElementById("timerDisplay");
        const historyBox = document.getElementById("history");
        const timeInput = document.getElementById("timeInput");

        timeInput.addEventListener("input", () => {
            targetSeconds = Number(timeInput.value);
        });

        function addToLog(time) {
            let log = document.createElement("p");
            log.innerText = `Time: ${time} sec`;
            historyBox.appendChild(log);
        }

        function startTimer() {
            clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                runningSeconds++;
                timerDisplay.innerText = runningSeconds;
                addToLog(runningSeconds);

                if (runningSeconds >= targetSeconds) {
                    clearInterval(timerInterval);
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            runningSeconds = 0;
            timerDisplay.innerText = "00";
            historyBox.innerHTML = "";
        }
    </script>

</body>

</html>
